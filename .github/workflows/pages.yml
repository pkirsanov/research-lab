name: pages
on:
  push:
    branches: [ "main" ]
  # Catch-up for the lost-push gap: GitHub does not fire `push` for commits pushed by the CI
  # bot, so band data commits land on main with no pages run attached. This schedule run is
  # mostly a no-op — the gate job below compares the freshly built site against the deployed
  # live site and only then does a schedule run pay for the full verify+deploy pipeline.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  # Event-driven catch-up for the same lost-push gap: the moment a tools-refresh run
  # completes, run the pipeline right away (its bot commit is already on main) instead of
  # waiting for the sparse */30 schedule. The gate deploys on a successful upstream run and
  # no-ops on failure/cancelled, so a red refresh can never trigger a deploy.
  workflow_run:
    workflows: ["tools-refresh"]
    types: [completed]
permissions: {}
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # ── DEPLOY GATE. Runs on EVERY event so its output is always defined (a job that needs a
  #    SKIPPED job does not reliably honor an if that references that job's outputs — proven
  #    by run 45074955520, where this whole pipeline was skipped on a push event). On schedule
  #    events it decides by content: freshly built site vs deployed live site. On push and
  #    manual events it deploys unconditionally, exactly as before the gate existed.
  #    Any uncertainty (network error, HTTP error, missing file, even a bug in the script)
  #    resolves to deploy, so the gate can never hide a stale site.
  gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
    - name: Checkout (schedule only)
      if: github.event_name == 'schedule'
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Node (schedule only)
      if: github.event_name == 'schedule'
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Build registered Pages artifact (schedule only)
      if: github.event_name == 'schedule'
      run: node scripts/build-pages-site.mjs
    - name: Decide
      id: decide
      env:
        EVENT: ${{ github.event_name }}
        CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "workflow_run" ]; then
          # Lost-push catch-up: tools-refresh bot commits never fire the push trigger.
          # Deploy immediately after a successful refresh; never on a failed/cancelled one.
          if [ "$CONCLUSION" = "success" ]; then
            echo "GATE deploy=true :: tools-refresh success — deploy"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "GATE deploy=false :: tools-refresh ${CONCLUSION} — no-op"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi
        if [ "$EVENT" != "schedule" ]; then
          echo "GATE deploy=true :: non-schedule event — always deploy"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        out="$(node scripts/pages-deploy-gate.mjs --site-dir _site --live-base "https://pkirsanov.github.io/research-lab")"
        echo "$out"
        case "$out" in
          "GATE deploy=false"*) echo "deploy=false" >> "$GITHUB_OUTPUT" ;;
          *) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;  # unexpected shape: fail open
        esac

  # ── BLOCKING. Deploy waits on this. Everything here is deterministic and offline: it reads
  #    committed data only, so a red result means THIS COMMIT is broken — never that a third-party
  #    market-data API was slow. A gate that goes red for reasons unrelated to the change is a gate
  #    people learn to ignore, and an ignored gate is worse than no gate.
  verify:
    needs: gate
    # The gate runs on every event, so this is the plain outputs pattern: schedule no-ops
    # (built site == live site) skip here; everything else deploys.
    if: needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Validate Node dependency source lock
      run: node scripts/validate-node-source-lock.mjs

    # The whole self-test — every assertion, not a sample. No browser, no network, seconds to run.
    # This is the single highest-value line in this file: it was previously not run in CI at all.
    - name: Self-test (all assertions)
      run: node scripts/selftest.mjs

    - name: Install source-locked browser test runner
      run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts
    - name: Verify checkout-local Playwright runner
      run: |
        runner_version="$(npx --no-install playwright --version)"
        printf '%s\n' "$runner_version"
        if [[ "$runner_version" != "Version 1.61.1" ]]; then
          printf 'Expected Version 1.61.1, got %s\n' "$runner_version" >&2
          exit 1
        fi

    - name: Build registered Pages artifact for browser verification
      run: node scripts/build-pages-site.mjs

    # Every Playwright spec is part of the deploy gate. The previously flaky options-flow ordering
    # regression is explicitly synchronized on the shipped rlviews:change signal and passes repeated
    # parallel execution; no external-provider availability is accepted as a reason to publish a
    # red build.
    - name: Full browser suite (blocking)
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
      run: npx --no-install playwright test --config=playwright.config.mjs --project=system-chrome --workers=1 --reporter=list,json
    # A red gate that fails in more than one owned area should say so here, so a reader can find
    # their own failures without downloading and parsing the report artifact by hand. This only
    # formats the failures the run already produced; the suite's exit code above remains the gate.
    - name: Name the owners of a red run
      if: failure()
      run: node scripts/summarize-failures.mjs playwright-report.json >> "$GITHUB_STEP_SUMMARY"
    - name: Upload browser report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          playwright-report.json
          test-results/
        retention-days: 7
        if-no-files-found: ignore

  deploy:
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Build registered Pages artifact
      run: node scripts/build-pages-site.mjs
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload registered site artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_site"
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # ── NON-BLOCKING and strictly downstream. This job reports; it gates nothing and can never
  #    influence verify or deploy.
  #
  #    Without it a red build is announced only by a colour on a page nobody has open. The failure
  #    that matters here is asymmetric: when deploy dies, the previously published site stays up
  #    and keeps serving the brief that was current at the last green run, with no staleness
  #    marker of any kind. The site does not look broken — it looks fine and is wrong.
  #
  #    `cancelled()` is deliberate. A workflow cannot see WHO cancelled a run, so a deliberate
  #    operator cancel is indistinguishable from a run killed by infrastructure. Alerting on both
  #    and printing the conclusion lets the operator dismiss the deliberate case; staying quiet
  #    unless certain would reinstate the silence this job removes.
  notify-failure:
    needs: [ verify, deploy ]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Minimum scope, declared at job level: naming any permission here drops every other scope to
    # none, so this job holds no pages, id-token, or contents authority at all.
    permissions:
      issues: write
    steps:
    - name: Open or update the failure issue
      uses: actions/github-script@v7
      env:
        # Passed through the environment rather than interpolated into the script body, so no
        # context value can ever be parsed as code.
        ALERT_WORKFLOW: ${{ github.workflow }}
        ALERT_VERIFY: ${{ needs.verify.result }}
        ALERT_DEPLOY: ${{ needs.deploy.result }}
        ALERT_EVENT: ${{ github.event_name }}
        ALERT_ACTOR: ${{ github.triggering_actor }}
        ALERT_SHA: ${{ github.sha }}
        ALERT_REF: ${{ github.ref_name }}
        ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const label = 'ci-failure';
          const title = 'CI alert: pages build/deploy is failing';

          // Name the job that actually broke. "Something in pages failed" is not actionable.
          const results = [
            ['verify', process.env.ALERT_VERIFY],
            ['deploy', process.env.ALERT_DEPLOY],
          ];
          const broke = results.filter(([, result]) => result !== 'success' && result !== 'skipped');
          const jobLine = (broke.length > 0 ? broke : results)
            .map(([name, result]) => '`' + name + '` \u2192 `' + (result || 'unknown') + '`').join(', ');

          const body = [
            '**Workflow:** `' + process.env.ALERT_WORKFLOW + '`',
            '**Job:** ' + jobLine,
            '**Trigger:** ' + process.env.ALERT_EVENT + ' on `' + process.env.ALERT_REF
              + '` \u2014 started by @' + process.env.ALERT_ACTOR,
            '**Commit:** `' + process.env.ALERT_SHA + '`',
            '**Run:** ' + process.env.ALERT_RUN_URL,
            '',
            'The previously deployed site is still live and still serving the brief from the last green',
            'run. It carries no staleness marker, so a visitor cannot tell that publishing has stopped.',
            '',
            'Close this issue once a run is green. The next failure after it is closed opens a new one.',
          ].join('\n');

          // Create the label before searching by it, so the very first alert on a fresh repository
          // cannot fail on a missing label. An alerting path that throws is as silent as none.
          try {
            await github.rest.issues.createLabel({
              owner, repo, name: label, color: 'b60205',
              description: 'Automated CI failure alert',
            });
          } catch (error) {
            if (error.status !== 422) throw error; // 422 = the label already exists
          }

          // De-duplicate against the OPEN alert thread. A fresh issue per failed run would self-spam
          // on every push, the operator would mute the channel, and the original silence would be
          // back. listForRepo is used rather than the search API because search indexing lags, and a
          // lagging lookup produces exactly the duplicate it is meant to prevent.
          const open = (await github.paginate(github.rest.issues.listForRepo, {
            owner, repo, state: 'open', labels: label, per_page: 100,
          })).find((issue) => issue.title === title);

          if (open) {
            await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
            core.notice('Appended this failure to existing alert issue #' + open.number);
          } else {
            const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            core.notice('Opened alert issue #' + created.data.number);
          }
