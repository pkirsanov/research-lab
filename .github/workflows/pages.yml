name: pages
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # ── BLOCKING. Deploy waits on this. Everything here is deterministic and offline: it reads
  #    committed data only, so a red result means THIS COMMIT is broken — never that a third-party
  #    market-data API was slow. A gate that goes red for reasons unrelated to the change is a gate
  #    people learn to ignore, and an ignored gate is worse than no gate.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Validate Node dependency source lock
      run: node scripts/validate-node-source-lock.mjs

    # The whole self-test — every assertion, not a sample. No browser, no network, seconds to run.
    # This is the single highest-value line in this file: it was previously not run in CI at all.
    - name: Self-test (all assertions)
      run: node scripts/selftest.mjs

    - name: Install source-locked browser test runner
      run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts
    - name: Verify checkout-local Playwright runner
      run: |
        runner_version="$(npx --no-install playwright --version)"
        printf '%s\n' "$runner_version"
        if [[ "$runner_version" != "Version 1.61.1" ]]; then
          printf 'Expected Version 1.61.1, got %s\n' "$runner_version" >&2
          exit 1
        fi

    # Every Playwright spec is part of the deploy gate. The previously flaky options-flow ordering
    # regression is explicitly synchronized on the shipped rlviews:change signal and passes repeated
    # parallel execution; no external-provider availability is accepted as a reason to publish a
    # red build.
    - name: Full browser suite (blocking)
      run: npx --no-install playwright test --config=playwright.config.mjs --project=system-chrome --workers=2 --reporter=list
    - name: Upload browser report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
        if-no-files-found: ignore

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Build registered Pages artifact
      run: node scripts/build-pages-site.mjs
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload registered site artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_site"
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
