name: tier-a

# The computed (Tier-A) layer is fully deterministic: it reads committed data and public market
# endpoints, and needs no model and no operator. Running it here removes the product's dependence on
# a particular laptop being open at 07:30 ET.
#
# The written (Tier-B) narrative deliberately stays operator-hosted. It is not moved here because it
# needs a model the repo does not own, and because a brief that fabricates a narrative on a schedule
# would be worse than one that admits it missed a window. When Tier-B is absent, market-brief.html
# renders the explicit "narrative not refreshed this window" state — that honest degradation is what
# makes this split safe.

on:
  schedule:
  # 07:30 / 11:00 / 15:00 / 17:00 America/New_York, expressed in UTC for both offsets, because
  # cron has no timezone. Resolve scheduled wall-clock time in America/New_York and skip the
  # inactive side of each pair, so exactly four windows execute in either DST season.
  - cron: "30 11 * * 1-5" # 07:30 EDT
  - cron: "30 12 * * 1-5" # 07:30 EST
  - cron: "0 15 * * 1-5" # 11:00 EDT
  - cron: "0 16 * * 1-5" # 11:00 EST
  - cron: "0 19 * * 1-5" # 15:00 EDT
  - cron: "0 20 * * 1-5" # 15:00 EST
  - cron: "0 21 * * 1-5" # 17:00 EDT
  - cron: "0 22 * * 1-5" # 17:00 EST
  workflow_dispatch:
    inputs:
      window:
        description: "ET brief window to compute"
        type: choice
        required: true
        options:
        - pre-market
        - morning
        - pre-close
        - after-hours
      dry-run:
        description: "Compute and print coverage without committing anything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "tier-a"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Republished purely so the failure alert can name WHICH ET window broke rather than making the
    # operator decode the cron. Adds no step, no ordering, and no gate.
    outputs:
      window: ${{ steps.window.outputs.window }}
    steps:
    - name: Resolve scheduled ET window
      id: window
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "window=${{ inputs.window }}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        event_schedule="${{ github.event.schedule }}"
        et_offset="$(TZ=America/New_York date +%z)"
        case "$event_schedule|$et_offset" in
          "30 11 * * 1-5|-0400"|"30 12 * * 1-5|-0500")
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "window=pre-market" >> "$GITHUB_OUTPUT"
            ;;
          "0 15 * * 1-5|-0400"|"0 16 * * 1-5|-0500")
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "window=morning" >> "$GITHUB_OUTPUT"
            ;;
          "0 19 * * 1-5|-0400"|"0 20 * * 1-5|-0500")
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "window=pre-close" >> "$GITHUB_OUTPUT"
            ;;
          "0 21 * * 1-5|-0400"|"0 22 * * 1-5|-0500")
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "window=after-hours" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "window=inactive-cron-pair" >> "$GITHUB_OUTPUT"
            echo "Skipping inactive cron pair schedule=$event_schedule ET-offset=$et_offset."
            ;;
        esac

    - name: Checkout
      if: steps.window.outputs.run == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # the recommendation backfill reads payload history from prior commits

    - name: Setup Node
      if: steps.window.outputs.run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    # Tier-A: recompute the owner-model reads and the snapshot from live public data.
    - name: Refresh Tier-A
      if: steps.window.outputs.run == 'true'
      run: node scripts/brief-refresh.mjs --window "${{ steps.window.outputs.window }}" ${{ inputs['dry-run'] && '--dry-run' || '' }}

    # Score any recommendation whose horizon has now elapsed. This is the feedback loop: it is
    # what turns published calls into a measured error rate, and it must not depend on a human
    # remembering to run it.
    - name: Evaluate elapsed recommendations
      if: steps.window.outputs.run == 'true'
      run: node scripts/evaluate-recommendations.mjs ${{ inputs['dry-run'] && '--dry-run' || '' }}

    - name: Rebuild the scorecard
      if: steps.window.outputs.run == 'true' && inputs['dry-run'] != true
      run: node scripts/build-scorecard.mjs

    # Keep the page's first load bounded as history grows.
    - name: Shard brief history
      if: steps.window.outputs.run == 'true' && inputs['dry-run'] != true
      run: node scripts/shard-brief-history.mjs

    - name: Build compact page artifacts
      if: steps.window.outputs.run == 'true'
      run: node scripts/build-brief-page-artifacts.mjs ${{ inputs['dry-run'] && '--dry-run' || '' }}

    # The same gate the deploy path uses. A scheduled run must never commit an artifact that
    # would fail the checks a human commit has to pass.
    - name: Self-test (all assertions)
      if: steps.window.outputs.run == 'true'
      run: node scripts/selftest.mjs

    - name: Commit refreshed artifacts
      if: steps.window.outputs.run == 'true' && inputs['dry-run'] != true
      run: |
        set -euo pipefail
        git config user.name  "research-lab-tier-a[bot]"
        git config user.email "research-lab-tier-a[bot]@users.noreply.github.com"
        # Named paths only. A scheduled job must never sweep in unrelated working-tree changes.
        git add -- \
          market-brief.snapshot.json \
          market-brief.scorecard.json \
          market-brief.page.json \
          market-brief.config.page.json \
          market-brief.snapshot.page.json \
          market-brief.tools.page.json \
          market-brief.experimental.json \
          brief-history.jsonl \
          brief-history.recent.jsonl \
          briefs/ \
          data/ 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "Tier-A produced no changes this window."
          exit 0
        fi
        git commit -m "tier-a: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
        git push

  # ── Failure alerting. This job reports; it can never affect the refresh above.
  #
  #    A scheduled window that dies quietly is this repo's worst failure mode: the site keeps
  #    serving the LAST successful brief with no staleness marker, so a stale brief reads exactly
  #    like a current one. That directly contradicts the product's central claim, so "nobody was
  #    watching" is not an acceptable outcome for a red run.
  #
  #    `cancelled()` is included on purpose. GitHub exposes no canceller identity to a workflow, so
  #    an operator cancelling deliberately and a run killed by infrastructure are indistinguishable
  #    from in here. We therefore alert on both and print the conclusion, letting the operator
  #    dismiss a deliberate one. The opposite trade — stay silent unless certain — is precisely the
  #    silence this job exists to remove.
  notify-failure:
    needs: refresh
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Minimum scope, declared at job level: naming any permission here drops every other scope to
    # none, so this job cannot write repository contents even if the script below were wrong.
    permissions:
      issues: write
    steps:
    - name: Open or update the failure issue
      uses: actions/github-script@v7
      env:
        # Passed through the environment rather than interpolated into the script body, so no
        # context value can ever be parsed as code.
        ALERT_WORKFLOW: ${{ github.workflow }}
        ALERT_RESULT: ${{ needs.refresh.result }}
        ALERT_EVENT: ${{ github.event_name }}
        ALERT_CRON: ${{ github.event.schedule }}
        ALERT_WINDOW: ${{ needs.refresh.outputs.window }}
        ALERT_ACTOR: ${{ github.triggering_actor }}
        ALERT_SHA: ${{ github.sha }}
        ALERT_REF: ${{ github.ref_name }}
        ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const label = 'ci-failure';
          const title = 'CI alert: tier-a scheduled refresh is failing';

          const cron = process.env.ALERT_CRON || '(not a scheduled run)';
          const trigger = process.env.ALERT_EVENT === 'schedule'
            ? 'schedule — cron `' + cron + '`'
            : process.env.ALERT_EVENT + ' — started by @' + process.env.ALERT_ACTOR;
          const window = process.env.ALERT_WINDOW
            || '(unresolved — the run died before the ET window was decided)';

          const body = [
            '**Workflow:** `' + process.env.ALERT_WORKFLOW + '`',
            '**Job:** `refresh` — concluded `' + process.env.ALERT_RESULT + '`',
            '**Trigger:** ' + trigger,
            '**ET window:** ' + window,
            '**Commit:** `' + process.env.ALERT_SHA + '` on `' + process.env.ALERT_REF + '`',
            '**Run:** ' + process.env.ALERT_RUN_URL,
            '',
            'While this is red the published brief silently stays at its last successful value. It does',
            'not mark itself stale, so treat this as a correctness incident and not a build annoyance.',
            '',
            'Close this issue once a window runs green. The next failure after it is closed opens a new one.',
          ].join('\n');

          // Create the label before searching by it, so the very first alert on a fresh repository
          // cannot fail on a missing label. An alerting path that throws is as silent as none.
          try {
            await github.rest.issues.createLabel({
              owner, repo, name: label, color: 'b60205',
              description: 'Automated CI failure alert',
            });
          } catch (error) {
            if (error.status !== 422) throw error; // 422 = the label already exists
          }

          // De-duplicate against the OPEN alert thread. Filing a fresh issue per failed run would
          // self-spam eight times a weekday, the operator would mute the channel, and the original
          // silence would be back. listForRepo is used rather than the search API because search
          // indexing lags and a lagging lookup produces exactly the duplicate it is meant to avoid.
          const open = (await github.paginate(github.rest.issues.listForRepo, {
            owner, repo, state: 'open', labels: label, per_page: 100,
          })).find((issue) => issue.title === title);

          if (open) {
            await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
            core.notice('Appended this failure to existing alert issue #' + open.number);
          } else {
            const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            core.notice('Opened alert issue #' + created.data.number);
          }
