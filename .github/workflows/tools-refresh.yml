name: tools-refresh
on:
  schedule:
    - cron: "30 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Brief window"
        required: false
        default: "morning"
        type: choice
        options:
          - pre-market
          - morning
          - pre-close
          - after-hours

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Refresh brief data
        run: |
          # No default window: with no input the script derives the window from the New York clock.
          # A hard-coded 'morning' republished an 11:00 snapshot after the after-hours narrative, which the
          # Portfolio Brief contract refuses (payload asOf later than the snapshot window cutoff).
          WINDOW="${{ github.event.inputs.window }}"
          if [ -n "$WINDOW" ]; then
            node scripts/brief-refresh.mjs --window "$WINDOW" || true
          else
            node scripts/brief-refresh.mjs || true
          fi
      - name: Sync payload session date
        run: node scripts/sync-payload-session-date.mjs
      - name: Build pages site
        run: node scripts/build-pages-site.mjs
      - name: Update tools manifest
        run: |
          python3 -c "import json, os, datetime; d=json.load(open('tools.json')); d['updated']=datetime.date.today().isoformat(); 
          for t in d['tools']:
              f=t.get('file')
              if f and os.path.exists(f):
                  mtime=os.path.getmtime(f)
                  mt=datetime.datetime.fromtimestamp(mtime).date().isoformat()
                  t['updated']=mt
          json.dump(d, open('tools.json','w'), indent=2)"
      - name: Sync inline tool dates
        run: node scripts/sync-inline-tool-dates.mjs
      - name: Shard brief history
        run: node scripts/shard-brief-history.mjs
      - name: Rebuild compact page artifacts
        run: node scripts/build-brief-page-artifacts.mjs
      - name: Commit and push
        run: |
          git config user.name "research-lab-bot"
          git config user.email "bot@research-lab.local"
          git add -A
          git diff --cached --quiet || git commit -m "tools-refresh: scheduled update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
